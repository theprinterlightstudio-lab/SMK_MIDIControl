name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        run: |
          chmod +x ./fm1
          ./fm1 build

      - name: Upload Elite firmware
        uses: actions/upload-artifact@v4
        with:
          name: smk37-elite-firmware
          path: build/dumbmidi-smk37-elite-*.fwsc
          if-no-files-found: error
